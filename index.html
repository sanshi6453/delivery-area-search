<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#176447">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="デポ検索">
  <meta name="description" content="住所からスーパーサンシ宅配サービスの配達店舗を検索します。">
  <title>スーパーサンシ 配達店舗検索</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <style>.postal-code{display:flex;flex-wrap:wrap;gap:.35em .7em;margin:7px 0 0;color:var(--gd);font-size:.9rem;font-weight:700}.postal-code span{color:var(--muted);font-size:.78rem}.note{white-space:pre-line}.note strong{color:var(--ink);font-weight:900}.card.limited{background:linear-gradient(135deg,#fffdf7,#fff7e2);border-color:#efd69b;border-left-color:#e2a126}.limited .badge{color:#7b5312;background:#fff0c7}.limited .store{color:#7b5312}.card.ise{background:linear-gradient(135deg,#f8feff,#eaf9fc);border-color:#b9e3eb;border-left-color:#37a9bd}.ise .badge{color:#176778;background:#dff5f8}.ise .store{color:#176778}.info-card .store{margin-bottom:10px}.info-message,.info-lead{margin:0;color:var(--muted);font-size:.92rem}.info-message strong{color:var(--gd)}.area-guide{text-align:left}.area-guide .area-block{margin-top:17px}.area-guide .area-block b{color:var(--ink);font-size:1rem}.area-guide .area-block p{margin:3px 0 0;color:var(--muted);line-height:1.8}.area-guide .retry{margin:22px 0 0;padding-top:12px;color:var(--red);border-top:1px solid var(--line);font-weight:800}.area-guide .limited-retry{color:#7b5312;border-top-color:#efd69b}.ise .ise-summary{color:#355e66;line-height:1.8}.ise .ise-retry{color:#176778;border-top-color:#b9e3eb}.area-map-details{margin-top:18px}.area-map-details summary{color:#176778;cursor:pointer;font-weight:800}.area-map{display:block;width:100%;height:auto;margin-top:12px;border:1px solid #b9e3eb;border-radius:10px}.contact{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.contact a{display:inline-block;margin-top:5px;color:var(--gd);font-weight:800;text-decoration:underline;text-underline-offset:3px}</style>
  <style>.top>div{position:relative}.header-mascot{position:absolute;z-index:2;top:7px;right:0;width:clamp(145px,23vw,190px);height:auto;pointer-events:none}@media(max-width:520px){.top>div{padding-right:128px}.header-mascot{top:13px;right:-8px;width:145px}}</style>
</head>
<body>
  <header class="top"><div><small>SUPER SANSHI</small><p>スーパーサンシ宅配サービス</p><img class="header-mascot" src="sanshi-chick.png" alt=""></div></header>
  <main>
    <section class="intro">
      <span>DELIVERY AREA SEARCH</span>
      <h1>配達店舗検索</h1>
      <p>配達店舗を検索します</p>
    </section>

    <section class="search-box" aria-label="住所検索">
      <form id="search-form">
        <label for="municipality">市町村を選ぶ <em>任意</em></label>
        <div class="select-wrap"><select id="municipality"><option value="">市町村を選択しない</option></select></div>
        <div class="or"><span>または</span></div>
        <label for="address">住所・町名・郵便番号を入力</label>
        <input id="address" type="search" inputmode="search" autocomplete="postal-code" enterkeyhint="search" placeholder="例：鈴鹿市算所、算所、513-0806">
        <p class="help">郵便番号は、〒・ハイフンの有無に関わらず検索OK</p>
        <button type="submit">検索する</button>
      </form>
      <p id="data-status" class="data-status" role="status">配達エリア情報を読み込んでいます…</p>
    </section>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="results-title"><h2>検索結果</h2><span id="result-count"></span></div>
      <div id="result-list" class="result-list"></div>
    </section>

    <aside><h2>検索について</h2><p>市町村を選んだ場合は町名だけでも検索できます。郵便番号は7桁で入力してください。担当店舗が複数表示された地域は、店舗への確認が必要です。</p><p class="contact">不明な場合は<br><a href="tel:0593794148">059-379-4148</a><br>(サンシ事業部 宅配開始案内)</p></aside>
  </main>
  <footer>スーパーサンシ宅配サービス 配達店舗検索</footer>
  <script src="config.js"></script>
  <script src="fallback-data.js?v=20260814-23"></script>
  <script src="script.js?v=20260814-23"></script>
</body>
</html>
